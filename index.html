<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Absensi SMK N 1 Kotamobagu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 15px 20px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 90%; max-width: 420px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.2); }
        .logo-school { width: 65px; height: auto; margin-bottom: 5px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        h2 { font-size: 1rem; margin: 0; letter-spacing: 0.5px; font-weight: 600; text-transform: uppercase; }
        h3 { font-size: 0.85rem; margin: 0 0 5px 0; font-weight: 400; opacity: 0.9; }
        #clock { font-size: 1.4rem; font-weight: 600; margin: 0 0 10px 0; color: #00ff88; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .camera-box { width: 100%; height: 440px; margin-bottom: 10px; border: 3px solid #fff; border-radius: 15px; overflow: hidden; background: #000; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        #webcam, #photoPreview { width: 100%; height: 100%; object-fit: cover; }
        #webcam { transform: scaleX(-1); }
        .coords-container { display: flex; gap: 6px; margin-bottom: 10px; }
        .coord-box { flex: 1; background: rgba(0, 0, 0, 0.3); padding: 5px; border-radius: 8px; font-size: 0.65rem; }
        .coord-label { display: block; font-size: 0.5rem; color: #bbb; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: none; box-sizing: border-box; text-align: center; font-family: 'Poppins'; outline: none; font-weight: 600; color: #333; }
        .button-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; transition: 0.3s; font-family: 'Poppins'; }
        .btn-datang { background: #00c853; flex: 1; opacity: 0.5; }
        .btn-pulang { background: #ff5252; flex: 1; opacity: 0.5; }
        .btn-ambil { background: #2196f3; margin-top: 2px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-kirim { background: #ff9800; margin-top: 2px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-ulang { background: rgba(255,255,255,0.2); border: 1px solid #fff; color: white; margin-top: 5px; width: 100%; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #666; cursor: not-allowed; opacity: 0.3 !important; }
        .btn.active-status { opacity: 1; border: 2px solid white; transform: scale(1.02); }
        .user-info { margin-bottom: 10px; background: rgba(255,255,255,0.95); padding: 6px 10px; border-radius: 10px; display: none; border-left: 5px solid #2196f3; color: #333; text-align: center; }
        #pesan { margin-top: 8px; font-weight: bold; font-size: 0.8rem; min-height: 1.1em; }
        .success-box { background: rgba(0,200,83,0.2); color: #00ff88; padding: 8px; border-radius: 10px; border: 1px solid #00c853; }
        .btn-keluar { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; font-size: 0.7rem; margin-top: 15px; padding: 6px 15px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-family: 'Poppins'; width: auto; display: inline-block; }
        .btn-home-monitoring { display: block; width: 100%; margin-top: 12px; padding: 12px; background: #ffffff; color: #1e3c72; border: none; border-radius: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Badges Warna Status */
        .badge { padding: 3px 8px; border-radius: 4px; color: white; font-weight: bold; font-size: 8pt; display: inline-block; }
        .bg-green { background-color: #16a34a; }
        .bg-yellow { background-color: #d97706; }
        .bg-red { background-color: #dc2626; }
        .bg-blue { background-color: #2563eb; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://smkn1ktg.sch.id/logo/logo.gif" class="logo-school" alt="Logo">
    <h2>E-ABSENSI</h2>
    <h3>SMK N 1 Kotamobagu</h3>
    <div id="clock">00:00:00</div>

    <div id="loginBox">
        <p style="font-size: 0.75rem; margin: 0 0 8px 0; opacity: 0.8;">Masukkan ID untuk masuk</p>
        <input type="text" id="nipInput" placeholder="NIP / ID ">
        <button onclick="prosesLogin()" id="btnLogin" class="btn btn-ambil">LANJUTKAN</button>
    </div>

    <div id="mainApp" style="display: none;">
        <div id="userInfo" class="user-info">
            <b id="displayNama"> Nama User </b> | 
            <span id="displayJabatan"> Jabatan </span>
        </div>

        <div class="camera-box">
            <video id="webcam" autoplay playsinline></video>
            <img id="photoPreview" style="display: none;" alt="Preview Foto">
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <div class="coords-container">
            <div class="coord-box"><span class="coord-label">LATITUDE</span><span id="lat-val">Mencari...</span></div>
            <div class="coord-box"><span class="coord-label">LONGITUDE</span><span id="lon-val">Mencari...</span></div>
        </div>
        
        <div class="button-group">
            <button id="btnDatang" class="btn btn-datang" onclick="selectType('Datang')">DATANG</button>
            <button id="btnPulang" class="btn btn-pulang" onclick="selectType('Pulang')">PULANG</button>
        </div>

        <button onclick="prosesAmbilAbsen()" id="btnAmbil" class="btn btn-ambil" disabled>📸 AMBIL ABSEN</button>
        
        <div id="postCaptureGroup" style="display: none;">
            <button onclick="kirimAbsen()" id="btnKirim" class="btn btn-kirim">🚀 KIRIM ABSEN</button>
            <button onclick="ulangFoto()" id="btnUlang" class="btn-ulang">🔄 Ulang Foto</button>
        </div>

        <div id="pesan"></div>
        <button onclick="logoutKeLogin()" class="btn-keluar">← Keluar / Ganti Akun</button>
        <button onclick="bukaDashboard()" class="btn-home-monitoring">🏠 MONITORING KEHADIRAN</button>
    </div>

    <div id="container-rekap-hasil" style="margin-top:20px;"></div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2Tcs8Z3MDqhHSDx6_Y2YIStdqN8WiWnq21mS0odlkZhJ4P_YRNPSziRo9iXkC20Z3/exec"; 

    let currentLat = 0, currentLon = 0, userData = null, statusAbsen = ""; 
    let modelsLoaded = false, preparedPayload = null;
    let globalDaftarLibur = [];
    window.rawRekapData = [];

    const video = document.getElementById('webcam');
    const photoPreview = document.getElementById('photoPreview');
    const canvas = document.getElementById('canvas');

    // 1. LOAD FACE-API MODEL
    async function loadModels() {
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        modelsLoaded = true;
    }
    loadModels();

    // 2. JAM DIGITAL & DETEKSI WAJAH CONTINUOUS
    setInterval(() => { 
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID'); 
        if(modelsLoaded && video.srcObject && video.style.display !== 'none' && !video.paused) {
            detectFace();
        }
    }, 1000);

    async function detectFace() {
        const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 });
        const detection = await faceapi.detectSingleFace(video, options);
        if (detection && statusAbsen && video.style.display !== 'none') {
            document.getElementById('btnAmbil').disabled = false;
        }
        return detection;
    }

    // 3. LOGIC LOGIN
    function prosesLogin() {
        const nip = document.getElementById('nipInput').value.trim();
        if (!nip) return alert("Masukkan ID/NIP!");

        const btnLogin = document.getElementById('btnLogin');
        btnLogin.disabled = true;
        btnLogin.innerText = "⏳ Mengecek...";

        fetch(`${SCRIPT_URL}?action=login&nip=${nip}`)
        .then(res => res.json())
        .then(res => {
            if (res && res.success) {
                userData = res;
                document.getElementById('displayNama').innerText = res.nama;
                document.getElementById('displayJabatan').innerText = res.jabatan;
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('userInfo').style.display = 'block';
                initCameraAndGPS();

                const pesanBox = document.getElementById('pesan');
                if (!res.bolehAbsen) {
                    document.getElementById('btnAmbil').disabled = true;
                    document.getElementById('btnDatang').disabled = true;
                    document.getElementById('btnPulang').disabled = true;
                    pesanBox.innerHTML = `<div style="background:#fff3cd; color:#856404; padding:15px; border-radius:10px; margin-top:10px;">⚠️ ${res.pesanWaktu}</div>`;
                } else {
                    document.getElementById('btnDatang').disabled = res.sudahDatang;
                    document.getElementById('btnPulang').disabled = res.sudahPulang;
                }
            } else {
                alert("❌ ID tidak terdaftar!");
                btnLogin.disabled = false;
                btnLogin.innerText = "LANJUTKAN";
            }
        })
        .catch(err => {
            alert("Error: Hubungan ke server terputus");
            btnLogin.disabled = false;
            btnLogin.innerText = "LANJUTKAN";
        });
    }

    // 4. INISIALISASI KAMERA & GPS
    async function initCameraAndGPS() {
        try { 
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
        } catch (err) { alert("Akses kamera ditolak!"); }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(p => {
                currentLat = p.coords.latitude; 
                currentLon = p.coords.longitude;
                document.getElementById('lat-val').innerText = currentLat.toFixed(6);
                document.getElementById('lon-val').innerText = currentLon.toFixed(6);
            }, null, { enableHighAccuracy: true });
        }
    }

    // 5. PILIH STATUS TIPE ABSEN
    function selectType(type) {
        statusAbsen = (type === 'Datang') ? 'in' : 'out';
        document.getElementById('btnDatang').classList.remove('active-status');
        document.getElementById('btnPulang').classList.remove('active-status');
        document.getElementById(type === 'Datang' ? 'btnDatang' : 'btnPulang').classList.add('active-status');
        
        if (video.style.display !== 'none') {
            document.getElementById('btnAmbil').disabled = false;
        }
    }

    // 6. TANGKAP FOTO ABSENSI
    async function prosesAmbilAbsen() {
        if(!userData || !statusAbsen || currentLat === 0) return alert("Pilih status DATANG/PULANG dan pastikan lokasi GPS terdeteksi!");
        
        const btn = document.getElementById('btnAmbil');
        const msg = document.getElementById('pesan');
        btn.disabled = true; 
        msg.innerHTML = "⏳ Memverifikasi Wajah...";

        const detection = await detectFace();
        if (!detection) {
            msg.innerHTML = `<div style="color:#ff5252;">❌ Wajah tidak terdeteksi! Sertakan wajah Anda dengan jelas.</div>`;
            btn.disabled = false;
            return;
        }

        canvas.width = video.videoWidth; 
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
        ctx.restore();
        
        const imageData = canvas.toDataURL('image/jpeg', 0.6);

        preparedPayload = { 
            id: userData.id, 
            nama: userData.nama, 
            gtk: userData.jabatan,
            lat: currentLat, 
            lng: currentLon, 
            image: imageData,
            tipe: statusAbsen,
            faceMatch: (detection.score * 100).toFixed(0)
        };

        photoPreview.src = imageData;
        photoPreview.style.display = 'block';
        video.style.display = 'none';
        if (video.srcObject) video.pause(); // Jeda kamera menghemat daya

        btn.style.display = 'none';
        document.getElementById('postCaptureGroup').style.display = 'block';
        msg.innerHTML = `<div style="color:#00ff88;">✅ Foto berhasil diambil. Klik "KIRIM ABSEN" untuk menyimpan.</div>`;
    }

    // 7. ULANG FOTO
    function ulangFoto() {
        photoPreview.style.display = 'none';
        video.style.display = 'block';
        if (video.srcObject) video.play(); // Putar kembali video kamera
        document.getElementById('btnAmbil').style.display = 'block';
        document.getElementById('btnAmbil').disabled = false;
        document.getElementById('postCaptureGroup').style.display = 'none';
        document.getElementById('pesan').innerHTML = "";
        preparedPayload = null;
    }

    // 8. KIRIM ABSEN
    function kirimAbsen() {
        if (!preparedPayload) return alert("Belum ada foto yang siap dikirim!");

        const btnKirim = document.getElementById('btnKirim');
        const btnUlang = document.getElementById('btnUlang');
        const msg = document.getElementById('pesan');

        btnKirim.disabled = true;
        btnUlang.disabled = true;
        msg.innerHTML = "⏳ Mengirim data absen...";

        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "simpanAbsen", payload: preparedPayload })
        })
        .then(res => res.json())
        .then(res => {
            if (res.success) {
                msg.innerHTML = `<div class="success-box"><b>${res.message}</b></div>`;
                setTimeout(() => { logoutKeLogin(); }, 2500); 
            } else {
                msg.innerHTML = `<div style="color:yellow;">${res.message}</div>`;
                btnKirim.disabled = false;
                btnUlang.disabled = false;
            }
        })
        .catch(err => {
            msg.innerHTML = `<div style="color:#ff5252;">❌ Gagal terhubung ke server. Coba lagi.</div>`;
            btnKirim.disabled = false;
            btnUlang.disabled = false;
        });
    }

    function bukaDashboard() {
        let idUser = (userData && userData.id) ? userData.id : document.getElementById('nipInput').value.trim();
        window.location.href = "dashboard.html?id=" + idUser;
    }

    function logoutKeLogin() {
        if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
        location.reload();
    }

    // ============================================================
    // INTEGRASI REKAP DATA & PENGECEKAN HARI LIBUR
    // ============================================================
    function loadDataRekap() {
        const container = document.getElementById('container-rekap-hasil');
        if (container) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">⏳ Memuat data rekap absensi...</div>';
        }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function(response) {
                    globalDaftarLibur = response.libur || [];
                    window.rawRekapData = response.rekap || [];
                    renderTabelRekap(window.rawRekapData);
                })
                .withFailureHandler(function(err) {
                    console.error("Gagal memuat rekap:", err);
                    if (container) container.innerHTML = '<div style="text-align:center; color:red; padding:20px;">❌ Gagal mengambil data.</div>';
                })
                .getRekapDataCombined();
        }
    }

    function renderTabelRekap(data) {
        const container = document.getElementById('container-rekap-hasil');
        if (!container) return;

        const selectedGtk = document.getElementById('filterGtkSelect') ? document.getElementById('filterGtkSelect').value : '';

        if (!data || data.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">📭 Tidak ada data ditemukan.</div>';
            return;
        }

        let filteredData = selectedGtk ? data.filter(d => d.nama === selectedGtk) : data;

        if (filteredData.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">📭 Tidak ada data untuk GTK yang dipilih.</div>';
            return;
        }

        let html = '<div id="rekapPrintArea">';

        // LAPORAN INDIVIDU
        if (selectedGtk) {
            const gtkInfo = filteredData[0];
            let totalHadir = 0, totalTerlambat = 0, totalTidakHadir = 0, totalLibur = 0;

            filteredData.forEach(r => {
                const status = (r.kehadiran || "").toLowerCase().trim();
                const ket = (r.keterangan || "").toLowerCase().trim();
                const jamDatang = (r.jam_datang || "").trim();

                const isLibur = globalDaftarLibur.includes(r.tanggal) || status.includes('libur') || ket.includes('libur');
                const isTidakHadir = !isLibur && (!jamDatang || jamDatang === '-' || status.includes('tidak hadir') || status.includes('alpa') || status.includes('izin') || status.includes('sakit') || ket.includes('tanpa keterangan'));
                const isTerlambat = !isLibur && (status.includes('terlambat') || ket.includes('terlambat'));

                if (isLibur) totalLibur++;
                else if (isTidakHadir) totalTidakHadir++;
                else if (isTerlambat) { totalTerlambat++; totalHadir++; }
                else totalHadir++;
            });

            html += `
                <div class="group-gtk" style="color: black; background:#fff; padding:15px; border-radius:10px; margin-bottom: 20px;">
                    <div style="text-align: center; border-bottom: 2px solid black; padding-bottom: 10px; margin-bottom: 15px;">
                        <img src="https://smkn1ktg.sch.id/logo/logo.gif" style="width: 50px; height: auto;">
                        <div style="font-size: 11pt; font-weight: bold; text-transform: uppercase;">Laporan Kehadiran Individu GTK</div>
                        <div style="font-size: 12pt; font-weight: bold;">SMK Negeri 1 Kotamobagu</div>
                    </div>

                    <table style="width:100%; margin-bottom:15px; font-size:10pt; border:none; text-align:left;">
                        <tr><td width="120"><b>Nama GTK</b></td><td width="10">:</td><td>${gtkInfo.nama}</td></tr>
                        <tr><td><b>Jabatan</b></td><td>:</td><td>${gtkInfo.jabatan}</td></tr>
                    </table>

                    <div style="display:flex; gap:8px; margin-bottom:15px; font-size:8pt; flex-wrap:wrap; justify-content:center;">
                        <div style="padding:6px 10px; background:#dcfce7; border:1px solid #16a34a; border-radius:4px; color:#16a34a;">Hadir: <b>${totalHadir}</b></div>
                        <div style="padding:6px 10px; background:#fef3c7; border:1px solid #d97706; border-radius:4px; color:#d97706;">Terlambat: <b>${totalTerlambat}</b></div>
                        <div style="padding:6px 10px; background:#fee2e2; border:1px solid #dc2626; border-radius:4px; color:#dc2626;">Tidak Hadir: <b>${totalTidakHadir}</b></div>
                        <div style="padding:6px 10px; background:#eff6ff; border:1px solid #2563eb; border-radius:4px; color:#2563eb;">Libur: <b>${totalLibur}</b></div>
                    </div>

                    <table border="1" style="width:100%; border-collapse:collapse; font-size: 9pt;">
                        <thead>
                            <tr style="background: #f1f5f9;">
                                <th width="30">No</th>
                                <th>Tanggal</th>
                                <th>Status</th>
                                <th>Masuk</th>
                                <th>Pulang</th>
                                <th>Keterangan</th>
                            </tr>
                        </thead>
                        <tbody>`;

            filteredData.forEach((r, i) => {
                const status = (r.kehadiran || "").toLowerCase().trim();
                const ket = (r.keterangan || "").toLowerCase().trim();
                const jamDatang = (r.jam_datang || "").trim();

                const isLibur = globalDaftarLibur.includes(r.tanggal) || status.includes('libur') || ket.includes('libur');
                const isTidakHadir = !isLibur && (!jamDatang || jamDatang === '-' || status.includes('tidak hadir') || status.includes('alpa') || status.includes('izin') || status.includes('sakit') || ket.includes('tanpa keterangan'));
                const isTerlambat = !isLibur && (status.includes('terlambat') || ket.includes('terlambat'));

                let badgeClass = 'bg-green', statusText = r.kehadiran || 'Hadir', rowStyle = '';

                if (isLibur) { badgeClass = 'bg-blue'; statusText = 'Libur'; rowStyle = 'background-color: #eff6ff;'; }
                else if (isTidakHadir) { badgeClass = 'bg-red'; statusText = 'Tidak Hadir'; rowStyle = 'background-color: #fff1f2;'; }
                else if (isTerlambat) { badgeClass = 'bg-yellow'; statusText = 'Terlambat'; rowStyle = 'background-color: #fffbeb;'; }

                html += `
                    <tr style="${rowStyle}">
                        <td style="text-align:center; padding:5px;">${i + 1}</td>
                        <td style="text-align:center; padding:5px;">${r.tanggal}</td>
                        <td style="text-align:center; padding:5px;"><span class="badge ${badgeClass}">${statusText}</span></td>
                        <td style="text-align:center; padding:5px;">${r.jam_datang || '-'}</td>
                        <td style="text-align:center; padding:5px;">${r.jam_pulang || '-'}</td>
                        <td style="font-size:8pt; padding:5px; ${isTidakHadir || isTerlambat ? 'color:#b91c1c; font-weight:bold;' : ''}">
                            ${r.keterangan || (isLibur ? 'Hari Libur Resmi' : (isTidakHadir ? 'Tidak melakukan absensi' : '-'))}
                        </td>
                    </tr>`;
            });

            html += `</tbody></table></div>`;

        // LAPORAN KOLEKTIF
        } else {
            const grouped = filteredData.reduce((acc, curr) => {
                if (!acc[curr.tanggal]) acc[curr.tanggal] = [];
                acc[curr.tanggal].push(curr);
                return acc;
            }, {});

            const sortedDates = Object.keys(grouped).sort((a, b) => b.split('/').reverse().join('-').localeCompare(a.split('/').reverse().join('-')));

            sortedDates.forEach(tgl => {
                html += `
                    <div class="group-tanggal" style="margin-bottom: 25px; background:#fff; padding:15px; border-radius:10px; color: black;">
                        <div style="text-align: center; border-bottom: 2px solid black; padding-bottom: 8px; margin-bottom: 12px;">
                            <div style="font-size: 10pt; font-weight: bold;">Rekap E-Absensi GTK - SMK N 1 Kotamobagu</div>
                            <div style="font-size: 8pt;">Tanggal: ${tgl}</div>
                        </div>

                        <table border="1" style="width:100%; border-collapse:collapse; font-size: 9pt;">
                            <thead>
                                <tr style="background: #f1f5f9;">
                                    <th width="30">No</th>
                                    <th>Nama</th>
                                    <th>Jabatan</th>
                                    <th>Status</th>
                                    <th>Masuk</th>
                                    <th>Pulang</th>
                                </tr>
                            </thead>
                            <tbody>`;

                grouped[tgl].forEach((r, i) => {
                    const status = (r.kehadiran || "").toLowerCase().trim();
                    const ket = (r.keterangan || "").toLowerCase().trim();
                    const jamDatang = (r.jam_datang || "").trim();

                    const isLibur = globalDaftarLibur.includes(r.tanggal) || status.includes('libur') || ket.includes('libur');
                    const isTidakHadir = !isLibur && (!jamDatang || jamDatang === '-' || status.includes('tidak hadir') || status.includes('alpa') || status.includes('izin') || status.includes('sakit') || ket.includes('tanpa keterangan'));
                    const isTerlambat = !isLibur && (status.includes('terlambat') || ket.includes('terlambat'));

                    let badgeClass = 'bg-green', statusText = r.kehadiran || 'Hadir', rowStyle = '';

                    if (isLibur) { badgeClass = 'bg-blue'; statusText = 'Libur'; rowStyle = 'background-color: #eff6ff;'; }
                    else if (isTidakHadir) { badgeClass = 'bg-red'; statusText = 'Tidak Hadir'; rowStyle = 'background-color: #fff1f2;'; }
                    else if (isTerlambat) { badgeClass = 'bg-yellow'; statusText = 'Terlambat'; rowStyle = 'background-color: #fffbeb;'; }

                    html += `
                        <tr style="${rowStyle}">
                            <td style="text-align:center; padding:5px;">${i + 1}</td>
                            <td style="font-weight:600; padding:5px; text-align:left;">${r.nama}</td>
                            <td style="text-align:center; padding:5px;">${r.jabatan}</td>
                            <td style="text-align:center; padding:5px;"><span class="badge ${badgeClass}">${statusText}</span></td>
                            <td style="text-align:center; padding:5px;">${r.jam_datang || '-'}</td>
                            <td style="text-align:center; padding:5px;">${r.jam_pulang || '-'}</td>
                        </tr>`;
                });

                html += `</tbody></table></div>`;
            });
        }

        html += '</div>';
        container.innerHTML = html;
    }
</script>
</body>
</html>
